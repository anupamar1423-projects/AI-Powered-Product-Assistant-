server {
    listen 7860;
    server_name _;
    client_max_body_size 20m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Streamlit runs with --server.baseUrlPath=studio, so the /studio/ prefix
    # must be preserved by proxy_pass. Do not add another /studio here.
    location = /studio {
        return 301 /studio/;
    }

    location /studio/ {
        proxy_pass http://127.0.0.1:8501/studio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # Uploaded product photos live on the persistent /data volume.
    location /media/ {
        alias /data/media/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120;
    }
}
